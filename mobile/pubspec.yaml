name: quy_nha_minh
description: Ứng dụng quản lý quỹ gia đình đa nền tảng
publish_to: none
version: 2.0.16+20
environment:
  sdk: '>=3.6.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  image_picker: ^1.2.0
  intl: ^0.20.2
  fl_chart: ^1.1.1
  cupertino_icons: ^1.0.8
  connectivity_plus: ^7.0.0
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  flutter_image_compress: ^2.4.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/app_logo.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app_logo.png
  adaptive_icon_foreground: assets/app_logo.png
  adaptive_icon_background: '#1769E0'












